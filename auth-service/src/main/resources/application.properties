spring.application.name=auth-service
server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Review 1 development key only. Set GRIDPULSE_JWT_SECRET to replace it outside local demos.
# HS256 requires at least 32 bytes; never use this fallback as a production secret.
gridpulse.jwt.secret=${GRIDPULSE_JWT_SECRET:GridPulse-Review1-Development-Key-Change-Me-2026}
gridpulse.jwt.expiration-seconds=${GRIDPULSE_JWT_EXPIRATION_SECONDS:3600}
