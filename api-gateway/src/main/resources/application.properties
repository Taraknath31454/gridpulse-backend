spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Must match Auth Service. Override both services with GRIDPULSE_JWT_SECRET outside local demos.
gridpulse.jwt.secret=${GRIDPULSE_JWT_SECRET:GridPulse-Review1-Development-Key-Change-Me-2026}

spring.cloud.gateway.server.webflux.routes[0].id=meter-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://METER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/meters,/api/meters/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth,/api/auth/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=usage-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://USAGE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/usage,/api/usage/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=alert-service-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ALERT-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/alerts,/api/alerts/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=anomaly-service-route
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ALERT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/anomalies,/api/anomalies/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1
